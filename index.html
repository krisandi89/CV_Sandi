<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krisandi Saptyanto | Design & Project Manager Portfolio</title>
    <meta name="description" content="Portfolio of Ir. Krisandi Saptyanto - Design & Project Manager with 13+ years in civil and geotechnical engineering, focused on geosynthetics-based solutions.">
    <meta name="keywords" content="Krisandi Saptyanto, Design Manager, Project Manager, Geotechnical Engineering, Geosynthetics, Retaining Walls, Civil Engineering">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>
    <!-- FLOATING SIDE NAVIGATION -->
    <nav class="side-nav" id="side-nav">
        <a href="#hero" class="nav-item active" data-tooltip="Home">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>
        <a href="#about" class="nav-item" data-tooltip="About">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </a>
        <a href="#skills" class="nav-item" data-tooltip="Skills">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                <polyline points="2 17 12 22 22 17"></polyline>
                <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
        </a>
        <a href="#projects" class="nav-item" data-tooltip="Portfolio">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
        </a>
        <a href="#experience" class="nav-item" data-tooltip="Experience">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
        </a>
        <a href="#education" class="nav-item" data-tooltip="Education">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"></path>
            </svg>
        </a>
        <a href="#contact" class="nav-item" data-tooltip="Contact">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
        </a>
    </nav>

    <!-- HERO SECTION -->
    <section id="hero" class="container">
        <div class="hero-content">
            <h2 class="hero-greeting" id="hero-name"></h2>
            <h1 class="heading-xl">
                <span id="hero-title"></span><br>
                <span id="hero-subtitle" class="hero-subtitle-text"></span>
            </h1>
            <p class="hero-description" id="hero-desc"></p>
            <div class="hero-cta">
                <a href="#projects" class="btn-primary">View My Work</a>
                <a href="#" class="btn-secondary" id="hero-contact-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                    Let's Connect
                </a>
            </div>
        </div>
        <div class="hero-visual">
            <div id="canvas-container"></div>
            <div class="hero-image-wrapper">
                <img id="hero-image" src="" alt="Profile Picture" class="hero-img-element">
                <div class="hero-image-glow"></div>
            </div>
        </div>
        <div class="scroll-indicator">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 13l5 5 5-5M7 6l5 5 5-5" />
            </svg>
        </div>
    </section>

    <!-- ABOUT SECTION -->
    <section id="about" class="section container">
        <h2 class="heading-lg" id="about-title">About Me</h2>
        <div class="about-content">
            <p id="about-text"></p>
        </div>
    </section>

    <!-- SKILLS SECTION -->
    <section id="skills" class="section container">
        <h2 class="heading-lg">Core Skills</h2>
        <div class="skills-grid" id="skills-container">
            <!-- Skills injected by JS -->
        </div>
    </section>

    <!-- TOP PROJECTS SECTION -->
    <section id="projects" class="section container">
        <h2 class="heading-lg">Featured Projects</h2>
        <div class="project-filters" id="project-filters">
            <!-- Filters injected by JS -->
        </div>
        <div class="projects-grid" id="projects-container">
            <!-- Projects injected by JS -->
        </div>
    </section>

    <!-- EXPERIENCE SECTION -->
    <section id="experience" class="section container">
        <h2 class="heading-lg">Project Experience</h2>
        <p class="section-subtitle" id="experience-count"></p>
        <div class="timeline-container" id="timeline-container">
            <!-- Timeline injected by JS -->
        </div>
        <div class="load-more-container">
            <button class="btn-secondary" id="load-more-btn" style="display: none;">Load More Projects</button>
        </div>
    </section>

    <!-- EDUCATION & CERTIFICATION SECTION -->
    <section id="education" class="section container">
        <h2 class="heading-lg">Education & Certifications</h2>
        <div class="education-grid">
            <div class="education-column">
                <h3 class="column-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                        <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"></path>
                    </svg>
                    Education
                </h3>
                <div id="education-container">
                    <!-- Education items injected by JS -->
                </div>
            </div>
            <div class="education-column">
                <h3 class="column-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="8" r="7"></circle>
                        <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
                    </svg>
                    Certifications
                </h3>
                <div id="certifications-container">
                    <!-- Certifications injected by JS -->
                </div>
            </div>
        </div>
    </section>

    <!-- LANGUAGES SECTION -->
    <section id="languages" class="section container">
        <h2 class="heading-lg">Languages</h2>
        <div class="languages-container" id="languages-container">
            <!-- Languages injected by JS -->
        </div>
    </section>

    <!-- CONTACT / FOOTER -->
    <footer id="contact">
        <div class="footer-container">
            <h2 class="footer-heading">Ready to build something amazing?</h2>
            <p class="footer-tagline">Always learning and improving</p>
            <a href="#" class="btn-primary" id="contact-email">Get in Touch</a>
            
            <div class="social-links" id="social-links">
                <!-- Social icons injected by JS -->
            </div>
            
            <div class="footer-bottom">
                &copy; <span id="year"></span> Krisandi Saptyanto. All rights reserved.
            </div>
        </div>
    </footer>

    <!-- MAIN SCRIPTS -->
    <script src="./src/content.js"></script>
    <script src="./src/three-scene.js"></script>
    <script src="./src/main.js"></script>

    <!-- PROJECT MODAL -->
    <div id="project-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" id="close-modal" aria-label="Close">&times;</button>
            <img src="" alt="" id="modal-image" class="modal-img">
            <div class="project-category" id="modal-category"></div>
            <h2 class="heading-lg modal-title" id="modal-title"></h2>
            <p id="modal-desc" class="modal-desc"></p>
            <a href="#" id="modal-link" class="btn-primary" target="_blank">View Project</a>
        </div>
    </div>
</body>

</html>
